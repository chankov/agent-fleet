name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one release run at a time so two runs never version or publish together.
concurrency: ${{ github.workflow }}-${{ github.ref }}

# PR code receives read-only permissions; publishing authority is job-local.
permissions:
  contents: read

jobs:
  installer-matrix:
    name: Installer (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The extracted-package compatibility test needs Node 18, while the full
      # suite and installer run on the current supported Node release below.
      - name: Setup Node 18 compatibility runtime
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Expose Node 18 compatibility runtime
        run: echo "AF_NODE18=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
      # Run environment-sensitive fixtures first so macOS path aliases fail
      # quickly and the portability check is not skipped after a suite failure.
      - name: Portability regressions (non-default temp root and symlink paths)
        run: npm run test:portability
      # CI qualification is the fast lane. The full suite stays available locally
      # via npm run test:full and is intentionally not run here.
      - name: Fast suite
        timeout-minutes: 10
        run: npm run test:fast
      - name: Verify generated manifest
        run: npm run check:manifest
      - name: Verify package contents
        run: npm run pack:dry

  release:
    name: Release
    needs: installer-matrix
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm Trusted Publishing support
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const version = process.argv[2];
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(version);
          if (!match) throw new Error(`npm version must be stable semver; got ${version}`);
          const [major, minor, patch] = match.slice(1).map(BigInt);
          if (major < 11n || (major === 11n && (minor < 5n || (minor === 5n && patch < 1n)))) {
            throw new Error(`npm ${version} is below the Trusted Publishing minimum of 11.5.1`);
          }
          console.log(`npm ${version} supports Trusted Publishing`);
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # A pending changeset is the only thing that cuts a release. There is no
      # release PR: CI rolls the changesets into a version commit pushed
      # straight to main with [skip ci] (so no extra workflow run starts), then
      # publishes in this same run. Without pending changesets nothing is
      # versioned. The version commit is pushed BEFORE publishing: if main moved
      # meanwhile the push is rejected and nothing is published.
      - name: Version pending changesets
        run: |
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)"
          if [ "$pending" -eq 0 ]; then
            echo "No pending changesets; no new version."
            exit 0
          fi
          # Force a patch bump, sync harness stamps and the lockfile, rebuild the
          # manifest and snapshot .versions/<new-version>/.
          npm run version:changeset
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${version} [skip ci]"
          git push origin HEAD:main

      # Fast suite already ran in installer-matrix. Re-running the full suite
      # here is what hung run 34457797354 (~39 min, no TAP summary, cancelled).
      # Keep this job for versioning + Trusted Publishing only.
      - name: Verify package contents
        run: npm run pack:dry

      # Idempotent: changeset publish skips a version already on npm, so a push
      # without changesets is a no-op, and a version whose publish failed is
      # published by the next run on main (push or workflow_dispatch).
      - name: Publish to npm, tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx changeset publish
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null && ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            git push origin "refs/tags/${tag}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null && ! gh release view "$tag" >/dev/null 2>&1; then
            node -e '
              const version = process.argv[1];
              const section = require("fs").readFileSync("CHANGELOG.md", "utf8").split(/^## /m).find(part => part.startsWith(version + "\n"));
              if (!section) throw new Error(`CHANGELOG.md has no section for ${version}`);
              process.stdout.write(section.slice(version.length + 1).trim() + "\n");
            ' "$version" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
