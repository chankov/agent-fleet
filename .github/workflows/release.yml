name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one release run at a time so the "Version Packages" PR stays sane.
concurrency: ${{ github.workflow }}-${{ github.ref }}

# PR code receives read-only permissions; publishing authority is job-local.
permissions:
  contents: read

jobs:
  installer-matrix:
    name: Installer (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The extracted-package compatibility test needs Node 18, while the full
      # suite and installer run on the current supported Node release below.
      - name: Setup Node 18 compatibility runtime
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Expose Node 18 compatibility runtime
        run: echo "AF_NODE18=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
      # Run environment-sensitive fixtures first so macOS path aliases fail
      # quickly and the portability check is not skipped after a suite failure.
      - name: Portability regressions (non-default temp root and symlink paths)
        run: npm run test:portability
      # CI qualification is the fast lane. The full suite stays available locally
      # via npm run test:full and is intentionally not run here.
      - name: Fast suite
        timeout-minutes: 10
        run: npm run test:fast
      - name: Verify generated manifest
        run: npm run check:manifest
      - name: Verify package contents
        run: npm run pack:dry

  release:
    name: Release
    needs: installer-matrix
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # The "chore: release" PR must be opened by a GitHub App, not by
      # GITHUB_TOKEN: PRs and pushes made with GITHUB_TOKEN wait for manual
      # "Approve and run", then expire as red no-job runs. Until the App is
      # configured (vars.RELEASE_APP_ID + secrets.RELEASE_APP_PRIVATE_KEY),
      # this step is skipped and the job falls back to GITHUB_TOKEN.
      - name: Mint release App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Checkout must persist the same token: its stored credential is what
      # changesets/action pushes the release branch with.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm Trusted Publishing support
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const version = process.argv[2];
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(version);
          if (!match) throw new Error(`npm version must be stable semver; got ${version}`);
          const [major, minor, patch] = match.slice(1).map(BigInt);
          if (major < 11n || (major === 11n && (minor < 5n || (minor === 5n && patch < 1n)))) {
            throw new Error(`npm ${version} is below the Trusted Publishing minimum of 11.5.1`);
          }
          console.log(`npm ${version} supports Trusted Publishing`);
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Fast suite already ran in installer-matrix. Re-running the full suite
      # here is what hung run 34457797354 (~39 min, no TAP summary, cancelled).
      # Keep this job for Trusted Publishing + changesets only.
      - name: Verify package contents
        run: npm run pack:dry

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Force a patch bump, sync the lockfile, then snapshot the bumped
          # version so the release PR contains .versions/<new-version>/.
          # Mirrors the local `version:changeset` script.
          version: npm run version:changeset
          publish: npx changeset publish
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
