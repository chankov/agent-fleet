# Flat profiles switch named personas; version: 2 profiles switch the complete fleet.
# See docs/agent-fleet-setup.md for defaults, child roles, services and policies.
mix-max:
  code-reviewer: xai/grok-4.7
  builder: openai-codex/gpt-6-sol
  planner: openai-codex/gpt-6-astra
  plan-reviewer: xai/grok-4.7
  security-auditor: openai-codex/gpt-6-sol
  test-engineer: xai/grok-4.7
local-workers:
  version: 2
  defaults:
    model: &qwenWorkers omlx/Qwen3.6-35B-A3B-4bit
    thinking: off
  allowed-models:
    - *qwenWorkers
  fallback: none
  routing: native
  agents:
    architect: *qwenWorkers
    bowser: *qwenWorkers
    builder: *qwenWorkers
    code-reviewer: *qwenWorkers
    deep-researcher: *qwenWorkers
    documenter: *qwenWorkers
    # orchestrator intentionally inherits the current selection.
    plan-reviewer: *qwenWorkers
    planner: *qwenWorkers
    releaser: *qwenWorkers
    researcher: *qwenWorkers
    security-auditor: *qwenWorkers
    test-engineer: *qwenWorkers
    web-debugger: *qwenWorkers
    web-performance-auditor: *qwenWorkers
  subagents:
    builder:
      recon: *qwenWorkers
      verifier: *qwenWorkers
    code-reviewer:
      preflight: *qwenWorkers
      quality: *qwenWorkers
      perf: *qwenWorkers
      docs: *qwenWorkers
    plan-reviewer:
      feasibility: *qwenWorkers
      deps: *qwenWorkers
    planner:
      scout: *qwenWorkers
      rules: *qwenWorkers
      voice-1: *qwenWorkers
      voice-2: *qwenWorkers
      voice-3: *qwenWorkers
    security-auditor:
      recon: *qwenWorkers
      input-sweep: *qwenWorkers
      secrets-sweep: *qwenWorkers
    test-engineer:
      coverage-scout: *qwenWorkers
      conventions: *qwenWorkers
  services:
    watchdog: *qwenWorkers
    return-extractor: *qwenWorkers
  panel:
    - name: qwen-a
      model: *qwenWorkers
    - name: qwen-b
      model: *qwenWorkers
    - name: qwen-integrator
      model: *qwenWorkers
      integrator: true

